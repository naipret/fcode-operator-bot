bot:
  clubCohortPrefix: 'F22'
  maxNicknameLength: 32
  allowedCohorts:
    - '20'
    - '21'
    - '22'
  allowedStudentIdPrefixes:
    - 'SE'
    - 'SS'
    - 'SA'
    - 'CS'
    - 'DS'
    - 'IA'
    - 'AI'
    - 'MC'
    - 'QE'
  studentIdRegex: '^[A-Za-z]{2}(\d{2})\d{4}$'
  fullNameRegex: '^[\p{L}\s]{2,60}$'
  nicknameTemplate: '{prefix}_{name}_{studentId}'

verification:
  enabledByDefault: true
  supportChannelId: ''

permissions:
  ownerRoleId: ''
  moderatorRoleId: ''
  stageRoleIds:
    challenge1: ''
    challenge2: ''
    challenge3: ''

database:
  directory: './data'

logging:
  level: 'info'
  console: true
  file: true
  directory: './logs'

messages:
  verificationPanelTitle: 'F-Code Recruitment Verification'
  verificationPanelDescription: "Welcome to the F-Code Club recruitment server.\n\nClick the button below to verify your student identity, receive your standardized nickname (`{prefix}_FullName_StudentID`), and unlock Challenge 1."
  verificationPanelButtonLabel: 'Verify Account'
  verificationClosedMessage: 'Verification is currently closed by the server administrator.'
  verificationSuccessTitle: 'Verification Complete'
  verificationAlreadyVerifiedTitle: 'Already Verified'
  verificationRestoredTitle: 'Account Restored'
  verificationErrorTitle: 'Verification Failed'
