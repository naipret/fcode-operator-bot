bot:
  # Prefix used for standardized nicknames (e.g., F22_NguyenVanA_SE220001)
  # and dynamic SQLite database naming (e.g., ./data/recruitment-f22.db)
  clubCohortPrefix: 'F22'
  maxNicknameLength: 32
  allowedCohorts:
    - '20'
    - '21'
    - '22'
  allowedStudentIdPrefixes:
    - 'SE'
    - 'SS'
    - 'SA'
    - 'CS'
    - 'DS'
    - 'IA'
    - 'AI'
    - 'MC'
    - 'QE'
  studentIdRegex: '^[A-Za-z]{2}(\d{2})\d{4}$'
  fullNameRegex: '^[\p{L}\s]{2,60}$'
  nicknameTemplate: '{prefix}_{name}_{studentId}'

verification:
  enabledByDefault: true
  # Round automatically granted upon verification alongside verifiedRoleId.
  # Options: 'none' | 'round-1' | 'round-2' | 'round-3'
  defaultRound: 'none'

permissions:
  # Grants full administrative access (/round, /system, and /student) equivalent to the Discord Server Owner
  ownerRoleId: ''
  # Grants student support access (/student commands only; cannot run /round or /system)
  moderatorRoleId: ''
  # Base role assigned to every candidate immediately upon successful verification
  verifiedRoleId: ''
  roundRoleIds:
    round1: ''
    round2: ''
    round3: ''

database:
  directory: './data'
  # Periodically reconciles manual SQLite database edits back to Discord members
  sync:
    enabled: true
    intervalMinutes: 5
  # Native SQLite online backup (VACUUM INTO) with automatic old-file pruning
  backup:
    enabled: true
    directory: './data/backups'
    # 1440 minutes = 24 hours
    intervalMinutes: 1440
    maxFiles: 7

logging:
  # 1. Local daily JSON log files (YYYY-MM-DD.log)
  file:
    enabled: true
    # Options: 'debug' | 'info' | 'warn' | 'error'
    level: 'debug'
    directory: './logs'
    maxFiles: 14
  # 2. Pretty-printed terminal output
  console:
    enabled: true
    # Options: 'debug' | 'info' | 'warn' | 'error'
    level: 'info'
  # 3. Batched operational log forwarding to a Discord text channel
  discord:
    enabled: true
    # Options: 'debug' | 'info' | 'warn' | 'error'
    level: 'info'
    channelId: ''

messages:
  verificationPanelTitle: 'Verify'
  verificationPanelDescription: 'Click the button below to verify your student identity.'
  verificationPanelButtonLabel: '✅ Verify account'
  verificationClosedMessage: 'Verification is currently closed by the server administrator.'
  verificationSuccessTitle: 'Verification Complete'
  verificationAlreadyVerifiedTitle: 'Already Verified'
  verificationRestoredTitle: 'Account Restored'
  verificationErrorTitle: 'Verification Failed'
